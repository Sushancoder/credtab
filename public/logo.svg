<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#047857;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Main shape scaled out slightly vertically to allow shadow space -->
  <g filter="url(#shadow)">
    <path d="M 85 30 A 35 35 0 1 0 85 90" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <rect x="52" y="54" width="38" height="12" rx="6" fill="url(#tabGrad)"/>
  </g>
</svg>
